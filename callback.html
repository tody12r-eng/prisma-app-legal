<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma - Concluindo a conexao</title>
<style>
  :root{--ink:#101418;--muted:#5b6672;--line:#e4e8ec;--brand:#1b7f6b;--bg:#fbfcfd;--warn:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;font-size:16px}
  .wrap{max-width:720px;margin:0 auto;padding:60px 20px}
  .mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#3fb99c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
  .note{border-left:3px solid var(--brand);padding:12px 16px;background:#f7fbfa;border-radius:10px;margin-top:16px;font-size:.94rem}
  .error{border-left-color:var(--warn);background:#fff7f6;color:var(--warn)}
  a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">P</div>
  <div class="card">
    <h2 id="title">Concluindo a conexao com o TikTok...</h2>
    <div id="msg" class="note">Aguarde alguns instantes.</div>
  </div>
</div>

<script src="./config.js"></script>
<script>
(function () {
  var cfg = window.PRISMA_CONFIG || {};
  var STATE_KEY = 'prisma_state';
  var TOKEN_KEY = 'prisma_session';
  var titleEl = document.getElementById('title');
  var msgEl = document.getElementById('msg');

  function apiBase() { return String(cfg.apiBase || '').replace(/\/+$/, ''); }
  function redirectUri() { return location.origin + location.pathname.replace(/[^/]*$/, '') + 'callback.html'; }
  function show(message, error) {
    msgEl.className = 'note' + (error ? ' error' : '');
    msgEl.innerHTML = message;
  }

  var params = new URLSearchParams(location.search);
  var code = params.get('code');
  var state = params.get('state');
  var error = params.get('error');
  var description = params.get('error_description');

  if (error) {
    titleEl.textContent = 'Autorizacao nao concluida';
    show('A TikTok retornou: <strong>' + error + '</strong> ' + (description || '') + '<br><br><a href="./index.html">Voltar ao aplicativo</a>', true);
    return;
  }
  if (!code) {
    titleEl.textContent = 'Retorno incompleto';
    show('Nao recebemos o codigo de autorizacao.<br><br><a href="./index.html">Voltar ao aplicativo</a>', true);
    return;
  }
  if (state !== localStorage.getItem(STATE_KEY)) {
    titleEl.textContent = 'Verificacao de seguranca falhou';
    show('O parametro de estado nao confere. Inicie a conexao novamente.<br><br><a href="./index.html">Voltar ao aplicativo</a>', true);
    return;
  }

  fetch(apiBase() + '/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code, redirect_uri: redirectUri() })
  })
    .then(function (response) {
      return response.text().then(function (text) {
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) { json = { raw: text }; }
        if (!response.ok || !json || !json.session) {
          var detail = json && (json.message || json.error) ? (json.message || json.error) : ('HTTP ' + response.status);
          throw new Error(detail);
        }
        return json;
      });
    })
    .then(function (result) {
      localStorage.setItem(TOKEN_KEY, result.session);
      localStorage.removeItem(STATE_KEY);
      titleEl.textContent = 'Conta conectada com sucesso';
      show('Redirecionando para o painel do Prisma...');
      location.replace('./index.html');
    })
    .catch(function (err) {
      titleEl.textContent = 'Nao foi possivel concluir a conexao';
      show(String(err.message || err) + '<br><br><a href="./index.html">Voltar ao aplicativo</a>', true);
    });
})();
</script>
</body>
</html>
